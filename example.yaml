esphome:
  name: halow-test
  friendly_name: HaLow Test Device

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf
    version: recommended

external_components:
  - source:
      type: local
      path: components

# HaLow network (replaces wifi:)
mm_halow:
  ssid: "halowlink2-627b"
  password: "your-password-here"
  country_code: "US"
  security: SAE                          # SAE (WPA3), OWE, or OPEN
  bcf_file: "bcf_mf16858_us.mbin"          # Board config for FGH100M-H (US)
  mm_iot_sdk_path: "~/esp/mm-iot-esp32"
  # manual_ip:
  #   static_ip: 192.168.1.86
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  #   dns1: 8.8.8.8
  # Pin defaults match XIAO HaLow Hat:
  # clk_pin: 7
  # mosi_pin: 9
  # miso_pin: 8
  # cs_pin: 4
  # irq_pin: 3
  # reset_pin: 1
  # wake_pin: 2
  # busy_pin: 5

  # Diagnostic sensors
  rssi:
    name: "HaLow RSSI"
  tx_packets:
    name: "HaLow TX Packets"
  rx_packets:
    name: "HaLow RX Packets"
  ip_address:
    name: "HaLow IP Address"
  gateway_address:
    name: "HaLow Gateway"
  connected_ssid:
    name: "HaLow SSID"
  bssid:
    name: "HaLow BSSID"
  mac_address:
    name: "HaLow MAC Address"
  firmware_version:
    name: "HaLow FW Version"

api:

logger:

ota:
  platform: esphome

sensor:
  - platform: uptime
    name: Uptime
  - platform: template
    name: "Free Heap"
    lambda: 'return esp_get_free_heap_size();'
    unit_of_measurement: "bytes"
    update_interval: 30s
    entity_category: diagnostic
  - platform: template
    name: "Min Free Heap"
    lambda: 'return esp_get_minimum_free_heap_size();'
    unit_of_measurement: "bytes"
    update_interval: 30s
    entity_category: diagnostic

debug:
  update_interval: 30s
