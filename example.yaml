esphome:
  name: halow-test
  friendly_name: HaLow Test Device

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf
    version: recommended

# Use the local external component
external_components:
  - source:
      type: local
      path: components

# HaLow network (replaces wifi:)
mm_halow:
  ssid: "halowlink2-627b"
  password: "your-password-here"
  country_code: "US"
  # Path to local MM-IoT-SDK clone (Seeed fork)
  mm_iot_sdk_path: "~/esp/mm-iot-esp32-upstream"
  # Pin defaults match XIAO HaLow Hat -- override for other boards:
  # clk_pin: 7
  # mosi_pin: 9
  # miso_pin: 8
  # cs_pin: 4
  # irq_pin: 3
  # reset_pin: 1
  # wake_pin: 2
  # busy_pin: 5

# ESPHome API for Home Assistant
api:

# Enable logging
logger:

# OTA updates (over HaLow!)
ota:
  platform: esphome
